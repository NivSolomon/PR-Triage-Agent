name: Deploy to Fly.io

# Runs after CI succeeds on main, so a failing typecheck or test never reaches production.
# Can also be started by hand from the Actions tab (re-deploy / roll forward).
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      simulate_failure:
        description: "Test the rollback: deploy, then force the health check to fail"
        type: boolean
        default: false

permissions:
  contents: read

# One deploy at a time: the app is a single machine with a SQLite volume.
concurrency:
  group: fly-deploy
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
      FLY_APP: pr-triage-agent
    steps:
      - uses: actions/checkout@v4
        with:
          # Deploy exactly the commit CI tested.
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - uses: superfly/flyctl-actions/setup-flyctl@master

      # Remember the image that is running now, so a bad deploy can be rolled back to it.
      - name: Record current image
        id: prev
        run: |
          IMAGE=$(flyctl machine list --app "$FLY_APP" --json | jq -r '.[0].config.image // empty')
          echo "Currently running: ${IMAGE:-<none>}"
          echo "image=$IMAGE" >> "$GITHUB_OUTPUT"

      - name: Deploy
        run: flyctl deploy --remote-only --app "$FLY_APP"

      - name: Health check
        env:
          SIMULATE_FAILURE: ${{ inputs.simulate_failure }}
        run: |
          if [ "$SIMULATE_FAILURE" = "true" ]; then
            echo "Simulated failure requested (rollback test): failing the health check on purpose."
            exit 1
          fi
          for i in $(seq 1 12); do
            if curl -fsS "https://$FLY_APP.fly.dev/healthz"; then
              echo; echo "Healthy after attempt $i"; exit 0
            fi
            echo "Not healthy yet (attempt $i), retrying in 10s..."; sleep 10
          done
          echo "Health check failed."
          exit 1

      # If the deploy or the health check failed, put the previous image back (only if the machine actually changed).
      - name: Roll back to previous image
        if: failure() && steps.prev.outputs.image != ''
        run: |
          CURRENT=$(flyctl machine list --app "$FLY_APP" --json | jq -r '.[0].config.image // empty')
          if [ "$CURRENT" = "${{ steps.prev.outputs.image }}" ]; then
            echo "Machine still runs the previous image; nothing to roll back."
            exit 0
          fi
          echo "Rolling back $CURRENT -> ${{ steps.prev.outputs.image }}"
          flyctl deploy --app "$FLY_APP" --image "${{ steps.prev.outputs.image }}"
          echo "::error::Deploy failed and was rolled back to ${{ steps.prev.outputs.image }}"
