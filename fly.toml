# Fly.io config. Change `app` to a unique name before the first deploy.
app = "pr-triage-agent"
primary_region = "fra"

[build]

[env]
  PORT = "3000"
  TZ = "Asia/Jerusalem"
  DATABASE_PATH = "/data/agent.sqlite"
  DIGEST_CRON = "30 8 * * 1-5"
  MONTHLY_BUDGET_USD = "50"
  HOSTING_COST_USD = "7"
  # Secrets (GITHUB_TOKEN, LLM_API_KEY, TELEGRAM_BOT_TOKEN, WEB_*_KEY, MCP_TOKENS, ...) are NOT here.
  # Set them with: fly secrets set NAME=value

[mounts]
  source = "agent_data"
  destination = "/data"

[http_service]
  internal_port = 3000
  force_https = true
  # Telegram long polling and the scheduler need the process to stay awake, so never auto-stop.
  auto_stop_machines = "off"
  auto_start_machines = false
  min_machines_running = 1

  [[http_service.checks]]
    method = "GET"
    path = "/healthz"
    interval = "30s"
    timeout = "5s"
    grace_period = "20s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
